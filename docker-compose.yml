# One-time setup, before first `docker compose up`:
#   docker network create schloss-net
#   git submodule update --init
# schlussel runs from its own repo (see schlussel/docker-compose.yml) and
# must be on the same network for tafel-backend to reach it by hostname.
#
# Neither service publishes a host port - both are reached through the
# tor gateway (see https://github.com/zudaR107/tor), which is the only
# container that binds to a host port. `tafel-data` is given a fixed
# name so it's the same physical volume whether this compose file is run
# standalone or included from tor's.
services:
  tafel-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_PATH: ${TAFEL_DATABASE_PATH:-/data/tafel.db}
      SCHLUSSEL_JWKS_URL: ${SCHLUSSEL_JWKS_URL:-http://schlussel:4000/.well-known/jwks.json}
      # Must match schlussel's own JWT_ISSUER (hardcoded to "schlussel" in
      # schlussel/docker-compose.yml).
      JWT_ISSUER: ${JWT_ISSUER:-schlussel}
      # Substitution var is TAFEL_ALLOWED_ORIGINS, not ALLOWED_ORIGINS -
      # when tor's docker-compose.yml includes this file alongside every
      # other service's, they'd otherwise all read the exact same outer
      # variable name, silently overriding each other. Container-internal
      # env var name is still plain ALLOWED_ORIGINS below - only the
      # outer name changed.
      ALLOWED_ORIGINS: ${TAFEL_ALLOWED_ORIGINS:-https://localhost,https://tafel.localhost}
      # Notification outbox delivery (see features/notifications/outbox.ts)
      # and the due-date scanner (features/notifications/scanner.ts) - same
      # tuning-knob names as every other producer, so one shared .env
      # default applies identically everywhere. Left unset, due-date
      # events still get recorded but queue up undelivered.
      GLOCKE_BASE_URL: ${GLOCKE_BASE_URL:-http://glocke-backend:3004}
      TAFEL_TO_GLOCKE_HMAC_KEY_ID: ${TAFEL_TO_GLOCKE_HMAC_KEY_ID:-}
      TAFEL_TO_GLOCKE_HMAC_SECRET: ${TAFEL_TO_GLOCKE_HMAC_SECRET:-}
      GLOCKE_DISPATCH_INTERVAL_MS: ${GLOCKE_DISPATCH_INTERVAL_MS:-1000}
      GLOCKE_OUTBOX_LEASE_MS: ${GLOCKE_OUTBOX_LEASE_MS:-30000}
      GLOCKE_FETCH_TIMEOUT_MS: ${GLOCKE_FETCH_TIMEOUT_MS:-10000}
      GLOCKE_WORKER_STOP_TIMEOUT_MS: ${GLOCKE_WORKER_STOP_TIMEOUT_MS:-5000}
      GLOCKE_MAX_ATTEMPTS: ${GLOCKE_MAX_ATTEMPTS:-8}
      GLOCKE_RETRY_BASE_DELAY_MS: ${GLOCKE_RETRY_BASE_DELAY_MS:-1000}
      GLOCKE_RETRY_MAX_DELAY_MS: ${GLOCKE_RETRY_MAX_DELAY_MS:-900000}
      GLOCKE_OUTBOX_RETENTION_MS: ${GLOCKE_OUTBOX_RETENTION_MS:-604800000}
      TAFEL_DUE_SCAN_INTERVAL_MS: ${TAFEL_DUE_SCAN_INTERVAL_MS:-3600000}
    volumes:
      - tafel-data:/data
    networks:
      - schloss-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  tafel-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SCHLUSSEL_URL: ${SCHLUSSEL_WEB_URL:-https://auth.localhost}
        VITE_SCHLOSS_URL: ${SCHLOSS_URL:-https://localhost}
        VITE_GLOCKE_URL: ${GLOCKE_URL:-https://glocke.localhost}
    restart: unless-stopped
    networks:
      - schloss-net
    depends_on:
      - tafel-backend

volumes:
  tafel-data:
    name: tafel-data

networks:
  schloss-net:
    external: true
