name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: tafel-api
            dockerfile: api/Dockerfile
          - image: tafel-web
            dockerfile: web/Dockerfile
    steps:
      # schloss-ui and schloss-server-kit are both git submodules - need
      # to be checked out so they're present in the build context these
      # Dockerfiles COPY from.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # ghcr.io requires lowercase; github.repository_owner preserves
          # the account's display case (zudaR107), so it's hardcoded here
          # rather than templated.
          tags: |
            ghcr.io/zudar107/${{ matrix.image }}:latest
            ghcr.io/zudar107/${{ matrix.image }}:${{ github.sha }}
